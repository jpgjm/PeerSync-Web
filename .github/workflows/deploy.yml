name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/peersync-wasm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('wasm/peersync-wasm/Cargo.lock') }}

      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(cargo metadata --manifest-path wasm/peersync-wasm/Cargo.toml --format-version 1 \
            | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='wasm-bindgen'][0])")
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build wasm
        run: |
          cd wasm/peersync-wasm
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../../web/src/wasm \
            target/wasm32-unknown-unknown/release/peersync_wasm.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        run: |
          cd web
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
